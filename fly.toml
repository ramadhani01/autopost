# fly.toml app configuration file generated for autopost-tiktok on 2026-10-22T23:56:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'autopost-tiktok'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  PYTHONUNBUFFERED = '1'
  TZ = 'Asia/Jakarta'

[[mounts]]
  source = 'tiktok_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
